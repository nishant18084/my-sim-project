name: Deploy Website

on:
  push:
    branches:
      - main  # Agar aapka master branch hai toh yahan master likhein

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          sed -i "s/API_KEY_PLACEHOLDER/${{ secrets.YOUTUBE_API_KEY }}/g" index.html
          sed -i "s/PLAYLIST_ID_PLACEHOLDER/${{ secrets.YOUTUBE_PLAYLIST_ID }}/g" index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

