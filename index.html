<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374248; border-radius: 4px; }
    .terminal-font { font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body class="text-[#e9edef] h-screen w-screen m-0 overflow-hidden flex flex-col justify-between select-none">

  <!-- SCREEN 1: LOGIN POPUP -->
  <div id="authBox" class="fixed inset-0 z-50 bg-[#0b141a] flex items-center justify-center p-4">
    <div class="bg-[#1f2c34] p-6 rounded-2xl w-full max-w-xs text-center shadow-2xl border border-[#2a3942]">
      <div class="w-14 h-14 bg-[#25d366] rounded-full flex items-center justify-center mx-auto mb-3 text-white font-bold text-2xl shadow-lg">W</div>
      <h2 class="text-xl font-bold mb-1 text-white">WhatsApp</h2>
      <p class="text-xs text-[#8696a0] mb-4">Enter your name to start</p>
      <input id="userNameInput" type="text" placeholder="Your Name" class="w-full bg-[#2a3942] px-4 py-2.5 rounded-lg text-sm outline-none text-white mb-4 placeholder-[#8696a0]" />
      <button onclick="loginUser()" class="w-full bg-[#00a884] text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-[#02906f]">Agree & Continue</button>
    </div>
  </div>

  <!-- FAKE HACKER TERMINAL OVERLAY -->
  <div id="hackerScreen" class="hidden fixed inset-0 z-50 bg-black text-[#00ff66] p-4 flex flex-col terminal-font">
    <div class="flex justify-between items-center border-b border-[#00ff66]/30 pb-2 mb-3">
      <div class="flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-red-500"></span>
        <span class="inline-block w-3 h-3 rounded-full bg-yellow-500"></span>
        <span class="inline-block w-3 h-3 rounded-full bg-green-500"></span>
        <span class="text-xs font-bold ml-2 tracking-widest text-[#00ff66]">TERMINAL://ROOT_ACCESS</span>
      </div>
      <button onclick="closeHackerMode()" class="text-xs px-2 py-1 bg-red-900/50 border border-red-500 rounded text-red-300 hover:bg-red-800">EXIT [X]</button>
    </div>

    <!-- Live Console Output -->
    <div id="terminalBody" class="flex-1 overflow-y-auto space-y-1 text-xs custom-scroll"></div>

    <!-- Terminal Footer -->
    <div class="mt-2 border-t border-[#00ff66]/30 pt-2 flex items-center gap-2">
      <span class="text-xs">root@server:~#</span>
      <input id="terminalInput" type="text" placeholder="Type 'scan', 'matrix', or 'exit'" class="flex-1 bg-transparent text-xs text-[#00ff66] outline-none border-none" onkeydown="handleTerminalCommand(event)" />
    </div>
  </div>

  <!-- MAIN WHATSAPP APP -->
  <div id="mainContainer" class="flex flex-col h-full w-full">
    <!-- Top Header -->
    <div class="pt-3 px-4 pb-2 bg-[#0b141a] flex justify-between items-center">
      <h1 class="text-xl font-bold text-[#e9edef] tracking-wide">WhatsApp</h1>
      <div class="flex items-center gap-4 text-[#aebac1]">
        <!-- Secret Hacker Mode Button -->
        <button onclick="openHackerMode()" title="Hacker Terminal" class="bg-[#1f2c34] px-2 py-1 rounded text-xs font-mono text-[#00ff66] border border-[#00ff66]/40 hover:bg-[#25d366]/20">
          &gt;_
        </button>
        <i data-lucide="camera" class="w-5 h-5 cursor-pointer"></i>
        <i data-lucide="search" class="w-5 h-5 cursor-pointer"></i>
        <i data-lucide="more-vertical" class="w-5 h-5 cursor-pointer"></i>
      </div>
    </div>

    <!-- TAB: CHATS -->
    <div id="tabChats" class="flex-1 flex flex-col overflow-hidden">
      <div class="px-3 py-2">
        <div class="bg-[#1f2c34] rounded-full flex items-center px-4 py-2 text-[#8696a0] gap-3">
          <i data-lucide="search" class="w-4 h-4"></i>
          <input id="searchInput" oninput="filterChats()" type="text" placeholder="Ask Meta AI or Search" class="bg-transparent text-xs w-full outline-none text-white placeholder-[#8696a0]" />
        </div>
      </div>

      <div id="chatListContainer" class="flex-1 overflow-y-auto custom-scroll divide-y divide-[#1f2c34]/40 px-1"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="h-16 bg-[#0b141a] border-t border-[#1f2c34] flex justify-around items-center px-2 z-10">
      <div class="flex flex-col items-center gap-1 text-[#25d366]">
        <i data-lucide="message-square" class="w-5 h-5"></i>
        <span class="text-[11px] font-semibold">Chats</span>
      </div>
      <div class="flex flex-col items-center gap-1 text-[#8696a0]">
        <i data-lucide="circle-dot" class="w-5 h-5"></i>
        <span class="text-[11px]">Updates</span>
      </div>
      <div class="flex flex-col items-center gap-1 text-[#8696a0]">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="text-[11px]">Communities</span>
      </div>
      <div class="flex flex-col items-center gap-1 text-[#8696a0]">
        <i data-lucide="phone" class="w-5 h-5"></i>
        <span class="text-[11px]">Calls</span>
      </div>
    </div>
  </div>

  <!-- CHAT ROOM SCREEN -->
  <div id="chatRoomScreen" class="hidden fixed inset-0 bg-[#0b141a] z-40 flex flex-col">
    <div class="h-14 bg-[#1f2c34] px-2 flex items-center justify-between border-b border-[#2a3942]">
      <div class="flex items-center gap-2">
        <button onclick="closeChat()" class="text-[#aebac1] p-1"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <div id="activeAvatar" class="w-9 h-9 rounded-full bg-[#00a884] flex items-center justify-center text-white font-bold text-sm">#</div>
        <div>
          <h2 id="activeName" class="text-sm font-semibold leading-tight">Room</h2>
          <span class="text-[11px] text-[#00a884]">online</span>
        </div>
      </div>
      <div class="flex items-center gap-4 text-[#aebac1] pr-2">
        <button onclick="openHackerMode()"><i data-lucide="shield-alert" class="w-5 h-5 text-[#00ff66]"></i></button>
        <i data-lucide="phone" class="w-5 h-5"></i>
      </div>
    </div>

    <div id="messagePane" class="flex-1 p-3 overflow-y-auto space-y-2 flex flex-col custom-scroll"></div>

    <form onsubmit="handleSend(event)" class="p-2 bg-[#0b141a] flex items-center gap-2">
      <div class="flex-1 bg-[#1f2c34] rounded-full px-3 py-2 flex items-center gap-2 text-[#8696a0]">
        <i data-lucide="smile" class="w-5 h-5"></i>
        <input id="chatInput" type="text" placeholder="Message" class="bg-transparent flex-1 outline-none text-white text-sm placeholder-[#8696a0]" autocomplete="off" />
      </div>
      <button type="submit" class="w-11 h-11 bg-[#00a884] text-white rounded-full flex items-center justify-center shrink-0">
        <i data-lucide="send" class="w-5 h-5"></i>
      </button>
    </form>
  </div>

  <script>
    const INITIAL_CHATS = [
      { id: 'cr-elec', name: 'CR Electronics', msg: 'defence buddy added +91...', time: '16:29', avatar: '⚡' },
      { id: 'elec-boys', name: 'ELECTRONICS_BOYS(26-27)', msg: 'Annapurna Sharma: All students must...', time: '12:51', avatar: '🎓' },
      { id: 'elec-grp', name: 'Electronics Group', msg: 'Adobe Scan 01 Sep...', time: '12:02', avatar: '📁' },
      { id: 'future-eng', name: 'The future eng.', msg: 'Abhishek Class joined using link...', time: '09:35', avatar: '🚀' },
      { id: 'sbte-bihar', name: 'SBTE BIHAR 2K26 (2.0)', msg: '+91 94308 joined using link...', time: '10:49', avatar: '🏛️' }
    ];

    let user = localStorage.getItem('user_name') || '';
    let currentChat = null;
    let terminalInterval = null;

    function init() {
      if (user) document.getElementById('authBox').classList.add('hidden');
      renderChats(INITIAL_CHATS);
      lucide.createIcons();
    }

    function loginUser() {
      const val = document.getElementById('userNameInput').value.trim();
      if (!val) return;
      user = val;
      localStorage.setItem('user_name', user);
      document.getElementById('authBox').classList.add('hidden');
    }

    function renderChats(listData) {
      const list = document.getElementById('chatListContainer');
      list.innerHTML = '';
      listData.forEach(c => {
        const item = document.createElement('div');
        item.className = 'py-3 px-3 flex items-center gap-3 cursor-pointer hover:bg-[#1f2c34]/50 transition';
        item.onclick = () => openChat(c);
        item.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-[#1f2c34] border border-[#2a3942] flex items-center justify-center text-xl shrink-0">${c.avatar}</div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="font-semibold text-sm text-[#e9edef] truncate">${c.name}</h3>
              <span class="text-[11px] text-[#8696a0]">${c.time}</span>
            </div>
            <p class="text-xs text-[#8696a0] truncate mt-0.5">${c.msg}</p>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function filterChats() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = INITIAL_CHATS.filter(c => c.name.toLowerCase().includes(query));
      renderChats(filtered);
    }

    function openChat(chat) {
      currentChat = chat;
      document.getElementById('activeName').textContent = chat.name;
      document.getElementById('activeAvatar').textContent = chat.avatar;
      document.getElementById('chatRoomScreen').classList.remove('hidden');
      loadMessages();
    }

    function closeChat() {
      document.getElementById('chatRoomScreen').classList.add('hidden');
    }

    function loadMessages() {
      const pane = document.getElementById('messagePane');
      pane.innerHTML = '';
      const msgs = JSON.parse(localStorage.getItem('wa_msgs_' + currentChat.id) || '[]');
      msgs.forEach(m => {
        const isMe = m.sender === user;
        const bubble = document.createElement('div');
        bubble.className = `p-2 px-3 rounded-lg max-w-[80%] text-sm ${isMe ? 'bg-[#005c4b] self-end' : 'bg-[#1f2c34] self-start'}`;
        bubble.innerHTML = `<div>${m.text}</div><div class="text-[9px] text-[#8696a0] text-right mt-0.5">${m.time}</div>`;
        pane.appendChild(bubble);
      });
      pane.scrollTop = pane.scrollHeight;
    }

    function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentChat) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgs = JSON.parse(localStorage.getItem('wa_msgs_' + currentChat.id) || '[]');
      msgs.push({ sender: user, text, time });
      localStorage.setItem('wa_msgs_' + currentChat.id, JSON.stringify(msgs));

      input.value = '';
      loadMessages();
    }

    // --- FAKE HACKER SIMULATION ENGINE ---
    const FAKE_SCRIPTS = [
      "INITIALIZING SECURE PROTOCOL...",
      "BYPASSING LOCAL PROXY: 192.168.1.104",
      "HANDSHAKE VERIFIED: PORT 443 OK",
      "DECRYPTING SHA-256 SYSTEM HASHES...",
      "SCANNING NETWORK NODES [||||||||||] 100%",
      "MEMORY DUMP: 0x7FFF5FBFFD04 ... OK",
      "FIREWALL INTEGRITY: SECURE",
      "TRACE ROUTE: BIHAR_GATEWAY_NODE_09",
      "ALERT: ENCRYPTION TUNNEL ACTIVE",
      "STATUS: PRANK SIMULATION COMPLETE (NO REAL BREACH)"
    ];

    function openHackerMode() {
      document.getElementById('hackerScreen').classList.remove('hidden');
      const term = document.getElementById('terminalBody');
      term.innerHTML = '<div class="text-white font-bold mb-2">=== CYBER SECURITY LAB SIMULATOR v2.4 ===</div>';
      
      let index = 0;
      clearInterval(terminalInterval);
      terminalInterval = setInterval(() => {
        if (index < FAKE_SCRIPTS.length) {
          const p = document.createElement('div');
          p.textContent = `[+] ${new Date().toLocaleTimeString()} -> ${FAKE_SCRIPTS[index]}`;
          term.appendChild(p);
          term.scrollTop = term.scrollHeight;
          index++;
        } else {
          clearInterval(terminalInterval);
        }
      }, 350);
    }

    function closeHackerMode() {
      clearInterval(terminalInterval);
      document.getElementById('hackerScreen').classList.add('hidden');
    }

    function handleTerminalCommand(e) {
      if (e.key === 'Enter') {
        const cmd = e.target.value.trim().toLowerCase();
        const term = document.getElementById('terminalBody');
        const echo = document.createElement('div');
        echo.className = 'text-white';
        echo.textContent = `root@server:~# ${cmd}`;
        term.appendChild(echo);

        if (cmd === 'exit') {
          closeHackerMode();
        } else if (cmd === 'scan') {
          openHackerMode();
        } else if (cmd === 'clear') {
          term.innerHTML = '';
        } else {
          const res = document.createElement('div');
          res.className = 'text-yellow-400';
          res.textContent = `Command '${cmd}' simulated. Type 'scan' to rerun or 'exit' to quit.`;
          term.appendChild(res);
        }
        e.target.value = '';
        term.scrollTop = term.scrollHeight;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
