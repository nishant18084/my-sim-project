<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - Netflix Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #141414; /* Netflix Signature Dark */
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Netflix Translucent Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            background-color: #141414;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            color: #E50914; /* Netflix Red */
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .brand-logo span {
            color: #ffffff;
            font-size: 14px;
            margin-left: 5px;
            font-weight: normal;
            background: #ff0000;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .search-box {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 4px;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: #bbb;
            padding: 0 10px;
            cursor: pointer;
        }

        /* Netflix Big Hero Billboard */
        .billboard {
            position: relative;
            width: 100%;
            height: 45vw;
            min-height: 360px;
            max-height: 560px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4%;
            background-image: linear-gradient(to top, #141414 10%, rgba(0,0,0,0) 90%), url('https://via.placeholder.com/1200x600/222/fff?text=YouTube+Trending');
        }

        .billboard-content {
            max-width: 600px;
            z-index: 2;
        }

        .billboard-content h1 {
            font-size: clamp(30px, 5vw, 50px);
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .billboard-content p {
            font-size: clamp(14px, 2vw, 16px);
            color: #e5e5e5;
            margin-bottom: 20px;
            line-height: 1.4;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        .n-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-play { background-color: #ffffff; color: #000000; }
        .btn-play:hover { background-color: rgba(255,255,255,0.75); }
        .btn-info { background-color: rgba(109, 109, 110, 0.7); color: #ffffff; }
        .btn-info:hover { background-color: rgba(109, 109, 110, 0.4); }

        /* Netflix Horizontal Scroll Rows */
        .movie-row {
            padding: 0 4%;
            margin-bottom: 40px;
            position: relative;
        }

        .row-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #e5e5e5;
        }

        .slider-wrapper {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .slider-wrapper::-webkit-scrollbar {
            display: none; /* Hide scrollbar for clean app mode */
        }

        /* Netflix Vertical Movie Poster Layout */
        .movie-card {
            min-width: 160px;
            width: 160px;
            height: 240px;
            background-color: #222;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .movie-card:hover {
            transform: scale(1.08);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 10px 10px 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 60%, rgba(0,0,0,0));
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .card-details span {
            font-weight: normal;
            color: #aaa;
            font-size: 10px;
            margin-top: 4px;
        }

        /* Mobile View Optimization for App Mode */
        @media (max-width: 768px) {
            header { height: 56px; padding: 0 16px; }
            .search-box { display: none; }
            .billboard { height: 65vw; padding: 0 16px; }
            .movie-card { min-width: 120px; width: 120px; height: 180px; }
            .row-title { font-size: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            NETFLIX <span id="yt-badge">YOUTUBE</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="YouTube videos search karein...">
            <button onclick="searchYouTube()"><i class="material-icons">search</i></button>
        </div>
    </header>

    <main>
        <div class="billboard" id="heroBillboard">
            <div class="billboard-content">
                <h1 id="heroTitle">Loading YouTube Trends...</h1>
                <p id="heroDesc">Connect ho raha hai, krpya prateeksha karein...</p>
                <div class="btn-container">
                    <button class="n-btn btn-play" id="heroPlayBtn"><i class="material-icons">play_arrow</i> Play</button>
                    <button class="n-btn btn-info"><i class="material-icons">info_outline</i> Details</button>
                </div>
            </div>
        </div>

        <div class="movie-row">
            <div class="row-title" id="row1Title">YouTube Trending Movies</div>
            <div class="slider-wrapper" id="trendingRow">
                </div>
        </div>
    </main>

    <script>
        const API_KEY = 'YOUR_YOUTUBE_API_KEY'; // Yahan apni Google YouTube API Key dalein
        const PLAYLIST_ID = 'YOUR_PLAYLIST_ID_OR_CHANNEL_ID'; // Yahan content playlist ya channel ID dalein

        // Initial YouTube Fetch Function
        async function fetchYouTubeData() {
            if(API_KEY === 'YOUR_YOUTUBE_API_KEY') {
                console.log("Please setup your YouTube Data API Key first.");
                loadFallbackCards(); // Demo cards status logic
                return;
            }

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=10&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
                const data = await response.json();
                renderNetflixStyle(data.items);
            } catch (error) {
                console.error("Error fetching data from YouTube API", error);
                loadFallbackCards();
            }
        }

        // Render functions into Netflix Interface
        function renderNetflixStyle(videos) {
            const row = document.getElementById('trendingRow');
            row.innerHTML = ''; // Clear row loader
            
            // Setup Main Billboard with 1st Video element
            if(videos.length > 0) {
                const topVideo = videos[0].snippet;
                document.getElementById('heroTitle').innerText = topVideo.title;
                document.getElementById('heroDesc').innerText = topVideo.description.substring(0, 150) + '...';
                document.getElementById('heroBillboard').style.backgroundImage = `linear-gradient(to top, #141414 10%, rgba(0,0,0,0) 90%), url('${topVideo.thumbnails.high.url}')`;
                document.getElementById('heroPlayBtn').onclick = () => window.open(`https://www.youtube.com/watch?v=${videos[0].snippet.resourceId.videoId}`, '_blank');
            }

            // Create horizontal slider cards
            videos.forEach(video => {
                const snip = video.snippet;
                const videoId = snip.resourceId.videoId;
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
                
                card.innerHTML = `
                    <img src="${snip.thumbnails.high.url}" alt="Poster">
                    <div class="card-details">
                        ${snip.title.substring(0, 30)}...
                        <span>${snip.channelTitle}</span>
                    </div>
                `;
                row.appendChild(card);
            });
        }

        // Search Trigger functionality
        async function searchYouTube() {
            let query = document.getElementById('searchQuery').value;
            if(!query || API_KEY === 'YOUR_YOUTUBE_API_KEY') return;

            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${query}&type=video&key=${API_KEY}`);
            const data = await res.json();
            
            // Format format adjustment maps
            const formattedItems = data.items.map(item => ({
                snippet: {
                    ...item.snippet,
                    resourceId: { videoId: item.id.videoId }
                }
            }));
            
            document.getElementById('row1Title').innerText = `Results for: ${query}`;
            renderNetflixStyle(formattedItems);
        }

        // Fallback placeholder function (agar API key na ho tab bhi UI dikhe)
        function loadFallbackCards() {
            document.getElementById('heroTitle').innerText = "Bollywood Double Dhamaka";
            document.getElementById('heroDesc').innerText = "YouTube server se live connected. Netflix design me free movies enjoy karein.";
            
            const row = document.getElementById('trendingRow');
            row.innerHTML = '';
            for(let i=1; i<=6; i++) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="https://via.placeholder.com/300x450/222/fff?text=YouTube+Movie+${i}" alt="Poster">
                    <div class="card-details">
                        YouTube Hit Movie ${i}
                        <span>Free Stream</span>
                    </div>
                `;
                row.appendChild(card);
            }
        }

        // Execution onload
        window.onload = fetchYouTubeData;

        // PWA App Mode Execution
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
