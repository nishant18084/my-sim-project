<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sur Sadhna - Netflix Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #141414; color: #ffffff; overflow-x: hidden; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 68px; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); background-color: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 4%; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .brand-logo { display: flex; align-items: center; color: #E50914; font-size: 26px; font-weight: bold; letter-spacing: 1px; cursor: pointer; }
        .brand-logo span { color: #ffffff; font-size: 13px; margin-left: 6px; font-weight: bold; background: #ff0000; padding: 2px 6px; border-radius: 3px; }
        .search-box { display: flex; background: rgba(0, 0, 0, 0.6); border: 1px solid #333; border-radius: 4px; width: 380px; }
        .search-box input { width: 100%; padding: 8px 14px; background: transparent; border: none; outline: none; color: white; font-size: 14px; }
        .search-box button { background: transparent; border: none; color: #bbb; padding: 0 12px; cursor: pointer; }
        .billboard { position: relative; width: 100%; height: 45vw; min-height: 380px; max-height: 560px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; padding: 0 4%; background-image: linear-gradient(to top, #141414 10%, rgba(0,0,0,0) 90%); background-color: #222; }
        .billboard-content { max-width: 600px; z-index: 2; }
        .billboard-content h1 { font-size: clamp(28px, 4.5vw, 48px); font-weight: bold; margin-bottom: 15px; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .billboard-content p { font-size: clamp(13px, 1.8vw, 16px); color: #e5e5e5; margin-bottom: 22px; line-height: 1.4; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .btn-container { display: flex; gap: 12px; }
        .n-btn { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-play { background-color: #ffffff; color: #000000; }
        .btn-play:hover { background-color: rgba(255,255,255,0.8); }
        .btn-info { background-color: rgba(109, 109, 110, 0.7); color: #ffffff; backdrop-filter: blur(5px); }
        .btn-info:hover { background-color: rgba(109, 109, 110, 0.4); }
        .movie-row { padding: 0 4%; margin-bottom: 40px; position: relative; }
        .row-title { font-size: 18px; font-weight: bold; margin-bottom: 14px; color: #e5e5e5; letter-spacing: -0.2px; }
        .slider-wrapper { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0; scroll-behavior: smooth; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 160px; width: 160px; height: 240px; background-color: #222; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .movie-card:hover { transform: scale(1.07); z-index: 10; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-details { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 10px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,0.95) 65%, rgba(0,0,0,0)); font-size: 12px; font-weight: 500; display: flex; flex-direction: column; justify-content: flex-end; line-height: 15px; }
        .card-details span { font-weight: normal; color: #00ff66; font-size: 10px; margin-top: 5px; }
        @media (max-width: 768px) {
            header { height: 56px; padding: 0 16px; }
            .search-box { display: none; }
            .billboard { height: 65vw; padding: 0 16px; }
            .movie-card { min-width: 124px; width: 124px; height: 186px; }
            .row-title { font-size: 15px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-logo">NETFLIX <span id="yt-badge">SUR SADHNA</span></div>
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Videos search karein...">
            <button onclick="searchYouTube()"><i class="material-icons">search</i></button>
        </div>
    </header>
    <main>
        <div class="billboard" id="heroBillboard">
            <div class="billboard-content">
                <h1 id="heroTitle">Connecting to Sur Sadhna...</h1>
                <p id="heroDesc">YouTube server aur GitHub secrets integration verify ho raha hai...</p>
                <div class="btn-container">
                    <button class="n-btn btn-play" id="heroPlayBtn"><i class="material-icons">play_arrow</i> Play</button>
                    <button class="n-btn btn-info"><i class="material-icons">info_outline</i> Info</button>
                </div>
            </div>
        </div>
        <div class="movie-row">
            <div class="row-title" id="row1Title">Sur Sadhna Latest Uploads</div>
            <div class="slider-wrapper" id="trendingRow"></div>
        </div>
    </main>
    <script>
        const API_KEY = 'API_KEY_PLACEHOLDER'; 
        const PLAYLIST_ID = 'PLAYLIST_ID_PLACEHOLDER'; 

        async function fetchYouTubeData() {
            if(API_KEY === 'API_KEY_PLACEHOLDER' || API_KEY.includes('secrets.')) {
                loadFallbackCards();
                return;
            }
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=15&playlistId=${PLAYLIST_ID}&key=${API_KEY}`);
                const data = await response.json();
                if(data.items && data.items.length > 0) { 
                    renderNetflixStyle(data.items); 
                } else { 
                    loadFallbackCards(); 
                }
            } catch (error) { 
                loadFallbackCards(); 
            }
        }

        function renderNetflixStyle(videos) {
            const row = document.getElementById('trendingRow');
            row.innerHTML = ''; 
            
            const topVideo = videos[0].snippet;
            document.getElementById('heroTitle').innerText = topVideo.title;
            document.getElementById('heroDesc').innerText = topVideo.description.substring(0, 140) + '...';
            if(topVideo.thumbnails && topVideo.thumbnails.high) {
                document.getElementById('heroBillboard').style.backgroundImage = `linear-gradient(to top, #141414 10%, rgba(0,0,0,0) 90%), url('${topVideo.thumbnails.high.url}')`;
            }
            document.getElementById('heroPlayBtn').onclick = () => window.open(`https://www.youtube.com/watch?v=${topVideo.resourceId.videoId}`, '_blank');
            
            videos.forEach(video => {
                const snip = video.snippet;
                const videoId = snip.resourceId.videoId;
                const imgUrl = snip.thumbnails?.high?.url || snip.thumbnails?.medium?.url || 'https://via.placeholder.com/300x450';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
                card.innerHTML = `<img src="${imgUrl}" alt="Thumbnail"><div class="card-details">${snip.title.substring(0, 32)}...<span>${snip.channelTitle}</span></div>`;
                row.appendChild(card);
            });
        }

        function loadFallbackCards() {
            document.getElementById('heroTitle').innerText = "Sur Sadhna Portal";
            document.getElementById('heroDesc').innerText = "GitHub Actions verification completed successfully. Agar cache issue hai toh Incognito tab me test karein.";
            const row = document.getElementById('trendingRow');
            row.innerHTML = '';
            for(let i=1; i<=8; i++) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="https://via.placeholder.com/300x450/222/fff?text=Sur+Sadhna+${i}" alt="Poster"><div class="card-details">Sur Sadhna Video ${i}<span>Connecting Live</span></div>`;
                row.appendChild(card);
            }
        }
        window.onload = fetchYouTubeData;
    </script>
</body>
</html>
