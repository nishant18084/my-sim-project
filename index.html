<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#111b21] text-[#e9edef] h-screen w-screen flex items-center justify-center m-0 font-sans overflow-hidden">

  <!-- Login Modal -->
  <div id="authBox" class="bg-[#202c33] p-6 rounded-2xl w-80 text-center shadow-2xl border border-[#222d34]">
    <div class="w-16 h-16 bg-[#00a884] rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl text-white shadow-md">W</div>
    <h2 class="text-xl font-bold mb-2 text-[#e9edef]">WhatsApp Web</h2>
    <p class="text-xs text-[#8696a0] mb-5">Apna naam daal kar start karein</p>
    
    <input 
      id="usernameInput" 
      type="text" 
      placeholder="Your Name..." 
      class="w-full p-3 rounded-lg bg-[#2a3942] text-white outline-none mb-4 text-sm placeholder-[#8696a0] border border-transparent focus:border-[#00a884]"
      autocomplete="off"
    />
    <button 
      type="button" 
      onclick="handleLogin()" 
      class="w-full bg-[#00a884] text-white py-3 rounded-lg font-semibold hover:bg-[#02906f] active:scale-95 transition"
    >
      Continue
    </button>
  </div>

  <!-- Main Chat Window -->
  <div id="appContainer" class="hidden w-full h-full flex relative">
    
    <!-- Left Sidebar (Chats List) -->
    <div id="sidebarPane" class="w-full md:w-1/3 min-w-[300px] max-w-[420px] border-r border-[#222d34] flex flex-col bg-[#111b21] h-full absolute md:relative z-20">
      <div class="h-16 bg-[#202c33] px-4 flex items-center justify-between border-b border-[#222d34]">
        <div class="flex items-center gap-3">
          <div id="myAvatar" class="w-10 h-10 rounded-full bg-[#00a884] flex items-center justify-center font-bold text-white uppercase"></div>
          <span id="myProfile" class="font-semibold text-sm capitalize"></span>
        </div>
        <button onclick="handleLogout()" class="text-xs text-[#8696a0] hover:text-red-400">Exit</button>
      </div>

      <!-- Contact List -->
      <div id="contactsContainer" class="flex-1 overflow-y-auto divide-y divide-[#222d34] custom-scroll"></div>
    </div>

    <!-- Right Chat Area -->
    <div id="chatPane" class="w-full flex-1 flex flex-col bg-[#0b141a] h-full">
      <div class="h-16 bg-[#202c33] px-4 flex items-center border-b border-[#222d34] gap-2">
        <!-- Back button for mobile -->
        <button onclick="goBackToChats()" class="md:hidden text-[#aebac1] px-2 py-1 text-xl font-bold">←</button>
        <div id="chatAvatar" class="w-10 h-10 rounded-full bg-[#6b7b84] flex items-center justify-center font-bold text-white uppercase">#</div>
        <div>
          <h3 id="activeChatTitle" class="font-semibold text-sm">Main Group</h3>
          <span class="text-xs text-[#00a884]">online</span>
        </div>
      </div>
      
      <!-- Messages Box -->
      <div id="messagePane" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col custom-scroll"></div>

      <!-- Message Input Form -->
      <form id="chatForm" onsubmit="sendMessage(event)" class="h-16 bg-[#202c33] px-4 flex items-center gap-2">
        <input 
          id="msgInput" 
          type="text" 
          placeholder="Type a message..." 
          class="flex-1 bg-[#2a3942] px-4 py-2.5 rounded-lg text-sm outline-none text-[#d1d7db] placeholder-[#8696a0]" 
          autocomplete="off" 
        />
        <button 
          type="submit" 
          class="bg-[#00a884] text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#02906f]"
        >
          Send
        </button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
