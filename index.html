<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-[#111b21] text-[#e9edef] h-screen w-screen flex items-center justify-center m-0 font-sans overflow-hidden">

  <!-- Login Modal -->
  <div id="authBox" class="bg-[#202c33] p-6 rounded-xl w-80 text-center shadow-2xl border border-[#222d34]">
    <div class="w-16 h-16 bg-[#00a884] rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl text-white">W</div>
    <h2 class="text-xl font-bold mb-4 text-[#e9edef]">WhatsApp Web</h2>
    <input id="usernameInput" type="text" placeholder="Apna username daalein..." class="w-full p-2.5 rounded-lg bg-[#2a3942] text-white outline-none mb-4 text-sm placeholder-[#8696a0]" />
    <button onclick="login()" class="w-full bg-[#00a884] text-white py-2.5 rounded-lg font-semibold hover:bg-[#02906f] transition">Continue</button>
  </div>

  <!-- Main Chat Window -->
  <div id="appContainer" class="hidden w-full h-full flex">
    <!-- Left Sidebar -->
    <div class="w-1/3 min-w-[300px] max-w-[400px] border-r border-[#222d34] flex flex-col bg-[#111b21]">
      <div class="h-16 bg-[#202c33] px-4 flex items-center justify-between border-b border-[#222d34]">
        <div class="flex items-center gap-3">
          <div id="myAvatar" class="w-10 h-10 rounded-full bg-[#00a884] flex items-center justify-center font-bold text-white uppercase"></div>
          <span id="myProfile" class="font-semibold text-sm capitalize"></span>
        </div>
        <button onclick="location.reload()" class="text-xs text-[#8696a0] hover:text-red-400">Logout</button>
      </div>
      <div id="usersList" class="flex-1 overflow-y-auto divide-y divide-[#222d34]"></div>
    </div>

    <!-- Right Chat Area -->
    <div class="flex-1 flex flex-col bg-[#0b141a]">
      <div class="h-16 bg-[#202c33] px-4 flex items-center border-b border-[#222d34]">
        <div id="chatAvatar" class="hidden w-10 h-10 rounded-full bg-[#6b7b84] flex items-center justify-center font-bold text-white mr-3 uppercase"></div>
        <div>
          <h3 id="chatTargetName" class="font-semibold text-sm">Select a user to chat</h3>
          <span id="chatTargetStatus" class="text-xs text-[#8696a0]"></span>
        </div>
      </div>
      <div id="messagePane" class="flex-1 p-4 overflow-y-auto space-y-2 flex flex-col"></div>
      <form id="chatForm" onsubmit="sendMessage(event)" class="h-16 bg-[#202c33] px-4 flex items-center gap-2">
        <input id="msgInput" type="text" placeholder="Type a message" class="flex-1 bg-[#2a3942] px-4 py-2 rounded-lg text-sm outline-none text-[#d1d7db] placeholder-[#8696a0]" disabled />
        <button type="submit" class="bg-[#00a884] text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-[#02906f]">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
