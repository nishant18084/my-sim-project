<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWN_CORE_NET Terminal</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            border: 1px solid #00ff00;
            padding: 15px;
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            height: 80vh;
            overflow-y: auto;
        }
        .status-bar {
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }
        .log-entry {
            margin: 5px 0;
            font-size: 0.85em;
            line-height: 1.4;
        }
        .highlight { color: #ffffff; font-weight: bold; }
        .warn { color: #ffcc00; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="status-bar">
        <div>SYS_MODE: <span class="highlight">EXT_SIM_TEST</span></div>
        <div>NET_MASK: <span class="highlight">OWN_CORE_NET</span></div>
    </div>
    
    <div id="log-container">
        <div class="log-entry">[INFO] System booted. Awaiting hardware injection...</div>
    </div>
</div>

<script>
    const logs = [
        "[OK] Physical SIM slot change detected.",
        "[WARN] Operator network handshake: FAILED (SIM Deactivated)",
        "[INFO] Initializing custom project override protocol...",
        "[OK] Stripping original carrier signatures...",
        "[INFO] Injecting interface: OWN_CORE_NET [v1.0.4]",
        "[OK] Socket connection power state: STABLE",
        "[INFO] Masking network link under anonymous gateway...",
        "[SUCCESS] Hardware interface masked successfully. System running in Sandbox Mode."
    ];

    let currentLog = 0;
    const container = document.getElementById('log-container');

    function printLog() {
        if (currentLog < logs.length) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            // Add custom colors based on keywords
            if(logs[currentLog].includes('[WARN]')) entry.className += ' warn';
            if(logs[currentLog].includes('[SUCCESS]')) entry.className += ' highlight';
            
            entry.innerHTML = logs[currentLog];
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            currentLog++;
            setTimeout(printLog, 1500); // 1.5 seconds delay per log
        }
    }

    // Simulate SIM insert detection after 2 seconds
    setTimeout(printLog, 2000);
</script>

</body>
</html>
