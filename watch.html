<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vi SIM Explorer - Watch Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .monitor-box { max-width: 500px; width: 100%; background: #1e293b; padding: 25px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
        .live-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 15px; }
        .data-row:last-of-type { border-bottom: none; margin-bottom: 20px; }
        .label { color: #94a3b8; }
        .value { font-weight: 500; color: #e2e8f0; }
        .btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
        .btn-action:hover { background: #7dd3fc; }
        .back-link { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 14px; margin-top: 15px; }
        .back-link:hover { color: #f8fafc; }
    </style>
</head>
<body>

<div class="monitor-box">
    <h2>
        <span>⚡ Live SIM Terminal</span>
        <span class="live-dot"></span>
    </h2>

    <div class="data-row">
        <span class="label">Operator:</span>
        <span class="value" style="color: #ef4444; font-weight: bold;">Vodafone Idea</span>
    </div>
    <div class="data-row">
        <span class="label">Signal Connection:</span>
        <span class="value" id="signal">Excellent (4G/5G)</span>
    </div>
    <div class="data-row">
        <span class="label">Card Type:</span>
        <span class="value">UICC (Smart Card)</span>
    </div>
    <div class="data-row">
        <span class="label">Frequency Band:</span>
        <span class="value" id="band">Band 40 (2300 MHz)</span>
    </div>

    <button class="btn-action" onclick="refreshData()">Force Network Refresh</button>
    
    <!-- Wapas home page par jaane ke liye link -->
    <a href="index.html" class="back-link">← Dashboard Par Wapas Jayein</a>
</div>

<script>
    function refreshData() {
        document.getElementById('signal').innerText = "Optimizing Network...";
        document.getElementById('band').innerText = "Scanning Frequency...";
        
        setTimeout(() => {
            document.getElementById('signal').innerText = "Connected to 5G NSA";
            document.getElementById('band').innerText = "Band 78 (3500 MHz)";
            alert("Vi Network Parameters Refreshed Successfully!");
        }, 1200);
    }
</script>

</body>
</html>
