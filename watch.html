<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Project - Watch Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .monitor-box { max-width: 500px; width: 100%; background: #111827; padding: 25px; border-radius: 15px; border: 1px solid #1f2937; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { color: #10b981; margin-bottom: 20px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2937; padding-bottom: 10px; }
        .live-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .data-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #1f2937; font-size: 15px; }
        .data-row:last-of-type { border-bottom: none; margin-bottom: 20px; }
        .label { color: #9ca3af; }
        .value { font-weight: bold; color: #f3f4f6; }
        .btn-action { background: #10b981; color: #0b0f19; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #34d399; }
        .back-link { display: block; text-align: center; color: #6b7280; text-decoration: none; font-size: 14px; margin-top: 20px; }
        .back-link:hover { color: #f3f4f6; }
    </style>
</head>
<body>

<div class="monitor-box">
    <h2>
        <span>⚙️ Custom SIM Core</span>
        <span class="live-dot"></span>
    </h2>

    <div class="data-row">
        <span class="label">Brand Operator:</span>
        <span class="value" style="color: #3b82f6;">Own Network (In-House)</span>
    </div>
    <div class="data-row">
        <span class="label">Architecture:</span>
        <span class="value">Next-Gen eSIM / iSIM Prototype</span>
    </div>
    <div class="data-row">
        <span class="label">Encryption Status:</span>
        <span class="value" id="crypto" style="color: #f59e0b;">Millette-22 Advanced</span>
    </div>
    <div class="data-row">
        <span class="label">Machine Frequency:</span>
        <span class="value" id="freq">Custom Band Alpha (900/1800)</span>
    </div>

    <button class="btn-action" onclick="simulateTest()">Run Chip Diagnostic</button>
    
    <a href="index.html" class="back-link">← Main Dashboard</a>
</div>

<script>
    function simulateTest() {
        document.getElementById('crypto').innerText = "Testing Keys...";
        document.getElementById('freq').innerText = "Re-aligning Signals...";
        
        setTimeout(() => {
            document.getElementById('crypto').innerText = "SECURE (AES-256 Passed)";
            document.getElementById('freq').innerText = "Frequency Stabilized ✅";
            alert("Diagnostic Tool Update: Custom Chip is responding perfectly!");
        }, 1500);
    }
</script>

</body>
</html>
